# Ротация логов проекта без root-прав.
# Запускается пользовательским cron: logrotate -s ~/.danang-logrotate.state logrotate.conf
# copytruncate обязателен: боты держат файл открытым на дозапись, и обычное
# переименование оставило бы их писать в уже отротированный inode.
# Путь ниже абсолютный и должен указывать на каталог проекта на этой машине —
# при переносе на другой сервер setup.sh сам печатает готовую sed-команду для правки.
/home/john_wick/projects/jw_danang_group_bot/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
